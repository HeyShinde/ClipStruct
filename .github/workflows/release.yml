name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build App
        run: |
          xcodebuild -scheme ClipStruct -configuration Release clean build CONFIGURATION_BUILD_DIR="$(pwd)/build/Release" CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES

      - name: Package Assets
        run: |
          cd build/Release
          
          # Create zip
          zip -r ClipStruct.app.zip ClipStruct.app
          
          # Create tar
          tar -cvf ClipStruct.app.tar ClipStruct.app
          
          # Create tar.xz
          tar -cJf ClipStruct.app.tar.xz ClipStruct.app
          
          # Create dmg
          mkdir -p dmg_staging
          cp -R ClipStruct.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          
          # Since the app name has version, let's extract the version from the tag (e.g. v2.0.1 -> 2.0.1)
          VERSION=${GITHUB_REF#refs/tags/v}
          DMG_NAME="ClipStruct-${VERSION}.dmg"
          
          create-dmg \
            --volname "ClipStruct" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "ClipStruct.app" 150 190 \
            --hide-extension "ClipStruct.app" \
            --app-drop-link 450 190 \
            "${DMG_NAME}" \
            dmg_staging/
          
          # Rename zip, tar, tar.xz to include version
          mv ClipStruct.app.zip "ClipStruct-${VERSION}.app.zip"
          mv ClipStruct.app.tar "ClipStruct-${VERSION}.app.tar"
          mv ClipStruct.app.tar.xz "ClipStruct-${VERSION}.app.tar.xz"

      - name: Generate Checksums
        run: |
          cd build/Release
          VERSION=${GITHUB_REF#refs/tags/v}
          shasum -a 256 "ClipStruct-${VERSION}.dmg" "ClipStruct-${VERSION}.app.zip" "ClipStruct-${VERSION}.app.tar" "ClipStruct-${VERSION}.app.tar.xz" > checksums.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/ClipStruct-*.dmg
            build/Release/ClipStruct-*.app.zip
            build/Release/ClipStruct-*.app.tar
            build/Release/ClipStruct-*.app.tar.xz
            build/Release/checksums.txt
          generate_release_notes: true
