<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050508" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#8b5cf6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#050508" />
  <rect width="1200" height="630" fill="url(#bg-glow)" />

  <!-- App Icon Card -->
  <g transform="translate(540, 110)">
    <rect width="120" height="120" rx="28" fill="#181829" stroke="rgba(255,255,255,0.15)" stroke-width="2"
      filter="url(#shadow)" />
    <!-- Icon symbol -->
    <image href="/icon.png" x="18" y="18" width="90" height="90" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- Title -->
  <text x="600" y="300" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="70"
    font-weight="800" fill="url(#text-grad)" letter-spacing="-0.02em">ClipStruct</text>

  <!-- Subtitle -->
  <text x="600" y="360" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="28" font-weight="500"
    fill="#94a3b8">The Ultimate, Privacy-First macOS Clipboard Manager</text>

  <!-- Feature tags -->
  <text x="600" y="420" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="19" font-weight="400"
    fill="#64748b">Instant Capture • Universal Search • Smart Categories • 100% On-Device</text>

  <!-- Pill Badges -->
  <g transform="translate(370, 480)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="210" height="42" rx="21" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.4)"
      stroke-width="1.5" />
    <text x="105" y="26" text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="15" font-weight="600"
      fill="#c4b5fd"> macOS 14 &amp; 15</text>

    <!-- Badge 2 -->
    <rect x="230" y="0" width="230" height="42" rx="21" fill="rgba(255, 255, 255, 0.05)"
      stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <text x="345" y="26" text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="15" font-weight="600"
      fill="#f8fafc">100% Free &amp; Offline</text>
  </g>
</svg>